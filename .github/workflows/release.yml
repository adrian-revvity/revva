name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck gate, then package installer + zip into release/
      - run: pnpm typecheck && pnpm ${{ matrix.dist }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: release/*

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Release notes from CHANGELOG
        id: notes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER=$(node -p "require('./package.json').version")
            TAG="v$VER"
          else
            TAG="$GITHUB_REF_NAME"
            VER="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Print the section between "## [<version>]" and the next "## [" heading.
          NOTES=$(awk -v tag="$VER" '
            $0 ~ "^## \\[" tag "\\]" { in_sec=1; next }
            in_sec && /^## \[/ { in_sec=0 }
            in_sec { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."; fi
          { echo "notes<<EOF"; echo "$NOTES"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          generate_release_notes: true
          body: ${{ steps.notes.outputs.notes }}
          files: release/*
